steps:
  - name: gcr.io/$PROJECT_ID/testrunner
    args:
      - '-c'
      - |
        set -e
        echo === Looking up config from parameter store ===
        dev_config=$(gcloud parametermanager parameters versions describe dev --parameter=infra-test-config --location=global --project $PROJECT_ID --format=json | python3 -c "import sys, json; print(json.load(sys.stdin)['payload']['data'])" | base64 --decode)
        SA_API_EVAL_IMAGE_DEV=$(echo $dev_config | python3 -c "import sys, json; print(json.load(sys.stdin)['cr-api-eval-image'])")

        preprod_config=$(gcloud parametermanager parameters versions describe preprod --parameter=infra-test-config --location=global --project $PROJECT_ID --format=json | python3 -c "import sys, json; print(json.load(sys.stdin)['payload']['data'])" | base64 --decode)
        SA_API_EVAL_IMAGE_RELEASES=$(echo $preprod_config | python3 -c "import sys, json; print(json.load(sys.stdin)['cr-api-eval-image'])")
        SA_API_EVAL_CRJ_NAME=$(echo $preprod_config | python3 -c "import sys, json; print(json.load(sys.stdin)['cr-api-eval-job-name'])")
        TARGET_PROJECT_ID=$(echo $preprod_config | python3 -c "import sys, json; print(json.load(sys.stdin)['project-id'])")

        echo === Pulling image dev image with tag $SHORT_SHA ===
        docker pull $$SA_API_EVAL_IMAGE_DEV:$SHORT_SHA

        echo === Build Docker image, tag and push to GAR ===
        docker tag $$SA_API_EVAL_IMAGE_DEV:$SHORT_SHA $$SA_API_EVAL_IMAGE_RELEASES:$TAG_NAME
        docker tag $$SA_API_EVAL_IMAGE_DEV:$SHORT_SHA $$SA_API_EVAL_IMAGE_RELEASES:latest
        docker push $$SA_API_EVAL_IMAGE_RELEASES:$TAG_NAME
        docker push $$SA_API_EVAL_IMAGE_RELEASES:latest

        echo === Deploy SA API evaluation cloud run job ===
        gcloud run jobs update $$SA_API_EVAL_CRJ_NAME --image=$$SA_API_EVAL_IMAGE_RELEASES:$TAG_NAME --region $LOCATION --project $$TARGET_PROJECT_ID

    id: Tag and push release image
    entrypoint: bash
timeout: 300s
options:
  logging: CLOUD_LOGGING_ONLY
